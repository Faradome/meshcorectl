[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshcorectl"
version = "0.2.0"
description = "A kubectl-style command line interface for MeshCore companion radios"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "William Canterbury", email = "william.canterbury@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "meshcore>=2.3.9",
    "bleak>=0.22",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-pyserial",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/Faradome/meshcorectl"
Issues = "https://github.com/Faradome/meshcorectl/issues"

[project.scripts]
meshcorectl = "meshcorectl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcorectl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=meshcorectl --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["meshcorectl"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# scripts/examples/ are carried over verbatim from the original meshcore-cli
# project -- e.g. getpos.py's `gi.require_version(...)` must precede its
# `from gi.repository import ...`, a real PyGObject requirement ruff's
# import-sort would "fix" into broken code. Reference material, not part
# of this package.
extend-exclude = ["scripts/examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "meshcore.*"
ignore_missing_imports = true
